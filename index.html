<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pokemon</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0a12;
        height: 100%;
        overflow: hidden;
        touch-action: none;
      }
      #game3d {
        position: fixed;
        inset: 0;
        display: block;
      }
      /* ---- scaled 480×320 UI overlay ---- */
      #ui {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 480px;
        height: 320px;
        transform-origin: center;
        pointer-events: none;
        z-index: 10;
        font-family: 'Courier New', Courier, monospace;
        font-size: 13px;
        color: #f8f8f8;
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.7);
      }
      #ui * { position: absolute; box-sizing: border-box; }
      .win {
        background: rgba(16, 24, 40, 0.94);
        border: 2px solid #f0f0f8;
        outline: 1px solid #6878a8;
        outline-offset: -4px;
        border-radius: 6px;
      }
      .txt { white-space: nowrap; line-height: 16px; }
      .small { font-size: 11px; }
      .gold { color: #f0d048; }
      .blue { color: #a8c0e8; }
      .green { color: #a8e0a8; }
      .txt.dim { color: #8890a8; }
      .center { text-align: center; }
      .right { text-align: right; }
      .blink { animation: blink 0.6s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .bar-bg { background: #283040; }
      .bar { left: 0; top: 0; height: 100%; width: 100%; }
      .banner {
        padding: 4px 10px;
        white-space: nowrap;
        width: auto;
        height: auto;
      }
      .sprite { image-rendering: pixelated; }
      /* ---- full-viewport overlays (attached to body, not #ui) ---- */
      .fade {
        position: fixed;
        inset: 0;
        background: #08080f;
        z-index: 50;
        pointer-events: none;
      }
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(8, 8, 16, 0.55);
        z-index: 5;
        pointer-events: none;
      }
      /* text-dim modifier; must never paint a background (it shares
         elements with .txt labels) */
      .dim { color: #8890a8; }
      /* ---- title / credits screens ---- */
      .screen {
        left: 0;
        top: 0;
        width: 480px;
        height: 320px;
        overflow: hidden;
      }
      .title-screen { background: linear-gradient(#182848, #080812); }
      .credits-screen { background: linear-gradient(#101030, #282818); }
      .title-logo {
        width: 480px;
        text-align: center;
        font-size: 52px;
        font-weight: bold;
        color: #f0d048;
        text-shadow:
          3px 3px 0 #403008,
          -2px -2px 0 #403008,
          2px -2px 0 #403008,
          -2px 2px 0 #403008;
        animation: pulse 3.2s ease-in-out infinite;
        line-height: 52px;
      }
      .small-logo { font-size: 20px; line-height: 20px; animation: none; }
      @keyframes pulse { 50% { transform: scale(1.04); } }
      .drift { opacity: 0.12; filter: sepia(1) hue-rotate(190deg); animation: drift 3s ease-in-out infinite alternate; }
      @keyframes drift { to { transform: translateY(-14px); } }
      .fame { opacity: 0; animation: fameIn 0.5s ease-out forwards; }
      @keyframes fameIn { to { opacity: 1; } }
      .credits-roll { animation: roll 16s linear forwards; line-height: 17px; }
      @keyframes roll { to { transform: translateY(-560px); } }
      /* ---- battle bits ---- */
      .evolve-flash {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(255, 255, 255, 0);
        transition: background 220ms;
        pointer-events: none;
      }
      .evolve-img {
        position: absolute;
        left: 50%;
        top: 40%;
        width: 180px;
        height: 180px;
        transform: translate(-50%, -50%);
        image-rendering: pixelated;
      }
      .dialog { z-index: 20; }
      /* ---- bright classic theme while a battle is on screen ---- */
      #ui.battle-lite { color: #2a2620; text-shadow: none; }
      .battle-lite .win {
        background: #f8f2e0;
        border-color: #4a4034;
        outline-color: #c0b088;
        color: #2a2620;
      }
      .battle-lite .gold { color: #9a7010; }
      .battle-lite .blue { color: #2858a8; }
      .battle-lite .green { color: #1a8838; }
      .battle-lite .txt.dim { color: #9a9282; }
      .battle-lite .bar-bg { background: #d8d0b8; }
      /* ---- pointer-lock crosshair ---- */
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        transform: translate(-50%, -50%);
        z-index: 8;
        pointer-events: none;
      }
      #crosshair::before, #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.8);
      }
      #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
      #crosshair::after { left: 0; top: 8px; width: 18px; height: 2px; }
      #crosshair.active::before, #crosshair.active::after { background: #f0d048; }
      #crosshair-hint {
        position: fixed;
        left: 50%;
        top: calc(50% + 22px);
        transform: translateX(-50%);
        z-index: 8;
        pointer-events: none;
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px;
        color: #f0d048;
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.85);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
